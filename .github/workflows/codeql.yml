name: CodeQL

# Static analysis of the GitHub Actions workflows themselves: script injection,
# excessive permissions, untrusted input. Results: Security → Code scanning.
on:
  push:
    branches: ["main"]
    paths: [".github/workflows/**"]
  pull_request:
    branches: ["main"]
    paths: [".github/workflows/**"]
  schedule:
    - cron: "34 8 * * 1" # weekly (Mon 05:34 BRT): new CodeQL queries re-check old code
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (actions)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload results to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: actions
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:actions"
