name: Deploy to GitHub Pages

# Runs on every push to main. Builds the site with Hugo and deploys the
# generated static files to GitHub Pages using GitHub's official Pages
# deployment action (no third-party tokens or secrets required).
on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build
        run: hugo --minify
        env:
          # Firebase web config for the anonymous view/like counters.
          # These are Firebase's public client identifiers, not access
          # credentials — the real protection is Firestore Security Rules,
          # not secrecy of these values. Kept as repo secrets anyway to
          # keep them out of git history and demonstrate CI/CD secret
          # management. See config/_default/params.toml for details.
          HUGO_PARAMS_FIREBASE_APIKEY: ${{ secrets.FIREBASE_API_KEY }}
          HUGO_PARAMS_FIREBASE_AUTHDOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          HUGO_PARAMS_FIREBASE_PROJECTID: ${{ secrets.FIREBASE_PROJECT_ID }}
          HUGO_PARAMS_FIREBASE_STORAGEBUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          HUGO_PARAMS_FIREBASE_MESSAGINGSENDERID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          HUGO_PARAMS_FIREBASE_APPID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
