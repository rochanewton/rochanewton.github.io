name: Deploy to GitHub Pages

# Runs on every push to main. Builds the site with Hugo (strict: any warning
# stops the deploy and the live site stays on the previous version) and
# publishes it with GitHub's official Pages actions — no third-party tokens.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - "SECURITY.md"
      - "cspell.json"
      - ".markdownlint*"
      - ".editorconfig"
      - ".vscode/**"
      - ".devcontainer/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build (strict)
        shell: bash
        run: hugo --panicOnWarning --minify 2>&1 | tee hugo-build.log
        env:
          # Firebase web config for the anonymous view/like counters.
          # These are Firebase's public client identifiers, not access
          # credentials — the real protection is Firestore Security Rules,
          # not secrecy of these values. Kept as repo secrets anyway to
          # keep them out of git history and demonstrate CI/CD secret
          # management. See config/_default/params.toml for details.
          HUGO_PARAMS_FIREBASE_APIKEY: ${{ secrets.FIREBASE_API_KEY }}
          HUGO_PARAMS_FIREBASE_AUTHDOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          HUGO_PARAMS_FIREBASE_PROJECTID: ${{ secrets.FIREBASE_PROJECT_ID }}
          HUGO_PARAMS_FIREBASE_STORAGEBUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          HUGO_PARAMS_FIREBASE_MESSAGINGSENDERID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          HUGO_PARAMS_FIREBASE_APPID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Job summary
        if: always()
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## Hugo build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | \`$EVENT\` |"
            echo "| Commit | \`${SHA:0:7}\` |"
            echo ""
            echo '```text'
            cat hugo-build.log 2>/dev/null || echo "build log not available"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
