name: Deploy to GitHub Pages

# Runs on every push to main. Builds the site with Hugo (strict: any warning
# stops the deploy and the live site stays on the previous version) and
# publishes it with GitHub's official Pages actions — no third-party tokens.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - "SECURITY.md"
      - "cspell.json"
      - ".markdownlint*"
      - ".editorconfig"
      - ".vscode/**"
      - ".devcontainer/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      upload-pages-artifact: true
    secrets: inherit

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

