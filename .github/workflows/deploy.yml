name: Deploy to GitHub Pages

# Runs on every push to main. Builds the site with Hugo (strict: any warning
# stops the deploy and the live site stays on the previous version) and
# publishes it with GitHub's official Pages actions — no third-party tokens.
on:
  push:
    branches: ["main"]
    paths-ignore:
      - "README.md"
      - "LICENSE*"
      - "SECURITY.md"
      - "cspell.json"
      - ".markdownlint*"
      - ".editorconfig"
      - ".vscode/**"
      - ".devcontainer/**"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Build (strict)
        run: hugo --panicOnWarning --minify
        env:
          # Firebase web config for the anonymous view/like counters.
          # These are Firebase's public client identifiers, not access
          # credentials — the real protection is Firestore Security Rules,
          # not secrecy of these values. Kept as repo secrets anyway to
          # keep them out of git history and demonstrate CI/CD secret
          # management. See config/_default/params.toml for details.
          HUGO_PARAMS_FIREBASE_APIKEY: ${{ secrets.FIREBASE_API_KEY }}
          HUGO_PARAMS_FIREBASE_AUTHDOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          HUGO_PARAMS_FIREBASE_PROJECTID: ${{ secrets.FIREBASE_PROJECT_ID }}
          HUGO_PARAMS_FIREBASE_STORAGEBUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          HUGO_PARAMS_FIREBASE_MESSAGINGSENDERID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          HUGO_PARAMS_FIREBASE_APPID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
