name: Build

# Reusable workflow: the single definition of how the site is built.
# Called by ci.yml (pull requests) and deploy.yml (push to main).
on:
  workflow_call:
    inputs:
      upload-pages-artifact:
        description: "Upload ./public as the GitHub Pages artifact (deploy only)"
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@2752ce1d29631191ea3f27c23495fa06139a5b78 # v3.2.1
        with:
          hugo-version: "0.164.0"
          extended: true

      - name: Cache Hugo resources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: resources/_gen
          key: hugo-resources-${{ runner.os }}-${{ hashFiles('content/**/*.png', 'content/**/*.jpg', 'content/**/*.webp', 'assets/**', 'config/**') }}
          restore-keys: |
            hugo-resources-${{ runner.os }}-

      - name: Build (strict)
        shell: bash
        run: hugo --panicOnWarning --minify --gc 2>&1 | tee hugo-build.log
        env:
          # Firebase web config for the anonymous view/like counters.
          # These are Firebase's public client identifiers, not access
          # credentials — the real protection is Firestore Security Rules,
          # not secrecy of these values. Kept as repo secrets anyway to
          # keep them out of git history and demonstrate CI/CD secret
          # management. See config/_default/params.toml for details.
          HUGO_PARAMS_FIREBASE_APIKEY: ${{ secrets.FIREBASE_API_KEY }}
          HUGO_PARAMS_FIREBASE_AUTHDOMAIN: ${{ secrets.FIREBASE_AUTH_DOMAIN }}
          HUGO_PARAMS_FIREBASE_PROJECTID: ${{ secrets.FIREBASE_PROJECT_ID }}
          HUGO_PARAMS_FIREBASE_STORAGEBUCKET: ${{ secrets.FIREBASE_STORAGE_BUCKET }}
          HUGO_PARAMS_FIREBASE_MESSAGINGSENDERID: ${{ secrets.FIREBASE_MESSAGING_SENDER_ID }}
          HUGO_PARAMS_FIREBASE_APPID: ${{ secrets.FIREBASE_APP_ID }}

      - name: Check internal links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress
            --root-dir ${{ github.workspace }}/public
            --remap "https://rochanewton\.me/ file://${{ github.workspace }}/public/"
            --index-files index.html
            'public/**/*.html'

      - name: Job summary
        if: always()
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          {
            echo "## Hugo build"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Trigger | \`$EVENT\` |"
            echo "| Commit | \`${SHA:0:7}\` |"
            echo ""
            echo '```text'
            cat hugo-build.log 2>/dev/null || echo "build log not available"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Pages
        if: inputs.upload-pages-artifact
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: inputs.upload-pages-artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./public

  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Markdown lint
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: |
            content/**/*.md
            archetypes/**/*.md
            *.md
