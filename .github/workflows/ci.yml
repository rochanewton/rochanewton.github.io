name: CI

# Strict build check for pull requests (Dependabot updates, config/layout changes).
# Direct pushes to main are checked by the same strict build in deploy.yml.
on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
