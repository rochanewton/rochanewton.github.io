{{ define "main" }}
  <h1>{{ .Title }}</h1>
  {{ .Content }}
  <ul class="post-list">
    {{ range .Pages }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <span class="post-date">{{ .Date.Format "Jan 2, 2006" }}</span>
        {{ if .Description }}<p>{{ .Description }}</p>{{ end }}
      </li>
    {{ end }}
  </ul>
{{ end }}
