<!DOCTYPE html>
<html lang="{{ .Site.LanguageCode }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} · {{ .Site.Title }}{{ end }}</title>
  <meta name="description" content="{{ if .Description }}{{ .Description }}{{ else }}{{ .Site.Params.description }}{{ end }}">
  <link rel="stylesheet" href="{{ "css/style.css" | relURL }}">
  <link rel="alternate" type="application/rss+xml" href="{{ "index.xml" | relURL }}" title="{{ .Site.Title }}">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <a class="brand" href="{{ "/" | relURL }}">{{ .Site.Title }}</a>
      <nav>
        {{ range .Site.Menus.main }}
          <a href="{{ .URL | relURL }}">{{ .Name }}</a>
        {{ end }}
      </nav>
    </div>
  </header>

  <main class="wrap">
    {{ block "main" . }}{{ end }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ now.Year }} {{ .Site.Params.author }}. Built with Hugo, deployed via GitHub Actions.
        <a href="{{ .Site.Params.linkedin }}" target="_blank" rel="noopener">LinkedIn</a> ·
        <a href="{{ .Site.Params.credly }}" target="_blank" rel="noopener">Credly</a> ·
        <a href="{{ "index.xml" | relURL }}">RSS</a>
      </p>
    </div>
  </footer>
</body>
</html>
