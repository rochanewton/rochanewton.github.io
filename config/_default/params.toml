# -- Theme Options --
# These options control how the theme functions and allow you to
# customise the display of your website.
#
# Refer to the theme docs for more details about each of these parameters.
# https://nunocoracao.github.io/blowfish/docs/configuration/#theme-parameters

colorScheme = "ocean"
defaultAppearance = "dark" # valid options: light or dark
autoSwitchAppearance = true

# Fixed background image shown behind every page (home, resume, articles, etc.)
defaultBackgroundImage = "img/site-background.svg"
backgroundCanvas = true

# Social share preview image (LinkedIn, Twitter, etc.) for pages with no feature image
defaultSocialImage = "img/avatar.png"

enableSearch = true
enableCodeCopy = true

mainSections = ["posts"]
disableImageOptimization = false
highlightCurrentMenuArea = true
smartTOC = true

[header]
  layout = "fixed" # valid options: basic, fixed

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile" # valid options: page, profile, hero, card, background, custom
  showRecent = true
  showRecentItems = 10
  showMoreLink = true
  showMoreLinkDest = "posts"
  cardView = true
  cardViewScreenWidth = false
  layoutBackgroundBlur = false # only used when layout equals background

[article]
  showDate = true
  showDateUpdated = false
  showAuthor = true
  showHero = true
  heroStyle = "basic" # valid options: basic, big, background
  showBreadcrumbs = true
  showDraftLabel = true
  showEdit = false
  editAppendPath = true
  seriesOpened = false
  showHeadingAnchors = true
  showPagination = true
  invertPagination = false
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  showAuthorsBadges = false
  showWordCount = true
  showSummary = true
  showViews = true
  showLikes = true
  sharingLinks = [ "linkedin", "twitter", "whatsapp", "reddit", "email"]

[list]
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  cardView = true
  cardViewScreenWidth = false
  groupByYear = false
  showViews = true
  showLikes = true

[term]
  cardView = true
  cardViewScreenWidth = false
  groupByYear = false
  showBreadcrumbs = true

[sitemap]
  excludedKinds = []

[taxonomy]
  showTermCount = true

[verification]
  # google = ""
  # bing = ""
  # pinterest = ""
  # yandex = ""

[umamiAnalytics]
  # websiteid = ""
  # domain = ""

# Firebase config for anonymous view/like counters (see partials/vendor.html
# in the Blowfish theme). The actual values are NOT stored here — they're
# injected at build time via environment variables in GitHub Actions
# (HUGO_PARAMS_FIREBASE_APIKEY, _AUTHDOMAIN, _PROJECTID, _STORAGEBUCKET,
# _MESSAGINGSENDERID, _APPID), sourced from repository secrets.
#
# For local development, export the same variables before running `hugo
# server`, or the Firebase-backed views/likes counters simply won't appear
# (everything else on the site builds and works normally without them).
[firebase]
