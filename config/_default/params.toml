# -- Theme Options --
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "ocean"
defaultAppearance = "dark"
autoSwitchAppearance = true

enableSearch = true
enableCodeCopy = true

mainSections = ["posts"]

disableImageOptimization = false

highlightCurrentMenuArea = true
smartTOC = true

[header]
  layout = "fixed"

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = false
  showAppearanceSwitcher = true
  showScrollToTop = true

[homepage]
  layout = "profile"
  showRecent = true
  showRecentItems = 5
  showMoreLink = true
  showMoreLinkDest = "posts"

[article]
  showDate = true
  showViews = false
  showLikes = false
  showAuthor = true
  showHero = true
  heroStyle = "background"
  showBreadcrumbs = false
  showDraftLabel = true
  showEdit = false
  showHeadingAnchors = true
  showPagination = true
  showReadingTime = true
  showTableOfContents = true
  showTaxonomies = true
  sharingLinks = ["linkedin", "twitter", "reddit", "whatsapp", "email"]

[list]
  showHero = false
  showBreadcrumbs = false
  showSummary = true
  showTableOfContents = false
  showCards = true
  groupByYear = true

[taxonomy]
  showTermCount = true
  showHero = false
  showBreadcrumbs = false
  cardView = true

[term]
  showHero = false
  showBreadcrumbs = false
  groupByYear = false
  cardView = true

# Free, privacy-friendly analytics without any paid plan.
# Sign up at https://umami.is (self-host) or use Google Analytics above.
[umamiAnalytics]
