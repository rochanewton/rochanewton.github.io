# -- Main Menu --
# The main menu is displayed in the header at the top of the page.
# Acceptable parameters are name, pageRef, page, url, title, weight.
#
# The simplest menu configuration is to provide:
#   name = The name to be displayed for this menu link
#   pageRef = The identifier of the page or section to link to
#
# By default the menu is ordered alphabetically. This can be
# overridden by providing a weight value. The menu will then be
# ordered by weight from lowest to highest.
#
# A menu item becomes a dropdown by giving one or more other items
# `parent = "<identifier>"` matching its `identifier`.

[[main]]
  name = "Home"
  pageRef = "/"
  weight = 10

[[main]]
  name = "Resume"
  pageRef = "resume"
  weight = 20

[[main]]
  identifier = "articles"
  name = "Articles"
  pageRef = "posts"
  weight = 30

[[main]]
  name = "IBM Sterling"
  pageRef = "categories/ibm-sterling"
  parent = "articles"
  weight = 31

[[main]]
  name = "Claude"
  pageRef = "categories/claude"
  parent = "articles"
  weight = 32

[[main]]
  identifier = "linkedin"
  pre = "linkedin"
  url = "https://www.linkedin.com/in/rochanewton"
  weight = 40


# -- Footer Menu --
# The footer menu is displayed at the bottom of the page, just before
# the copyright notice. Configure as per the main menu above.

[[footer]]
  name = "Resume"
  pageRef = "resume"
  weight = 10

[[footer]]
  name = "Tags"
  pageRef = "tags"
  weight = 20

[[footer]]
  name = "Categories"
  pageRef = "categories"
  weight = 30

[[footer]]
  name = "RSS"
  url = "/index.xml"
  weight = 40
